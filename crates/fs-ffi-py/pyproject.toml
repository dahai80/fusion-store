[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "fusion-store"
version = "0.1.0"
description = "fusion-store Python 绑定（PyO3，读路径强制拷贝 E3）"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["numpy>=1.21"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "fusion_store"
