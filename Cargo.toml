[workspace]
members = [
    "crates/fs-core",
    "crates/fs-cli",
    "crates/fs-ffi-c",
    "crates/fs-ffi-py",
    "crates/fs-serve",
]
resolver = "2"

[workspace.package]
version = "0.2.0-rc.1"
edition = "2021"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
# 核心存储
memmap2 = "0.9"
heed = "0.21"
arrow = "54"
# 错误/日志/序列化
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = "1"
# 多进程写锁
fs2 = "0.4"
# POSIX statvfs（compact 磁盘预检 guard）
libc = "0.2"
# HTTP daemon / CLI
tokio = { version = "1", features = ["full"] }
axum = "0.7"
prometheus = "0.13"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
# Python 绑定
pyo3 = { version = "0.29", features = ["extension-module"] }
# 测试
tempfile = "3"
proptest = "1"

# release profile：opt3 + thin lto + strip 符号 + 单 codegen unit（F-OPS-5 hardened）
# 注：不加 panic="abort" —— fs-ffi-c/fs-ffi-py 是 cdylib，FFI 边界 panic=abort 会直接终止宿主进程，
# 跨 FFI panic 安全性未评估，保留 unwind（Rust panic 经 FFI 边界本就 UB，但 unwind 比 abort 更可观测）
[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
